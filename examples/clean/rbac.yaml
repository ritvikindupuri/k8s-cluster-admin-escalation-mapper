apiVersion: v1
kind: List
items:
  - {apiVersion: v1, kind: Namespace, metadata: {name: shop, labels: {pod-security.kubernetes.io/enforce: restricted}}}
  - {apiVersion: v1, kind: ServiceAccount, metadata: {name: api, namespace: shop}, automountServiceAccountToken: false}
  - {apiVersion: v1, kind: ServiceAccount, metadata: {name: ci-deployer, namespace: shop}}
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata: {name: cluster-admin}
    rules:
      - {apiGroups: ["*"], resources: ["*"], verbs: ["*"]}
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata: {name: platform-admins}
    roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin}
    subjects:
      - {kind: Group, name: platform-admins, apiGroup: rbac.authorization.k8s.io}
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata: {name: rollout-only, namespace: shop}
    rules:
      - apiGroups: ["apps"]
        resources: ["deployments"]
        resourceNames: ["api"]
        verbs: ["get", "patch"]
      - {apiGroups: [""], resources: ["pods", "pods/log"], verbs: ["get", "list", "watch"]}
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata: {name: ci-rollout, namespace: shop}
    roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: rollout-only}
    subjects:
      - {kind: ServiceAccount, name: ci-deployer, namespace: shop}

apiVersion: v1
kind: List
items:
  - {apiVersion: v1, kind: Namespace, metadata: {name: team-a}}
  - {apiVersion: v1, kind: Namespace, metadata: {name: ci}}
  - {apiVersion: v1, kind: Namespace, metadata: {name: ops}}
  - {apiVersion: v1, kind: Namespace, metadata: {name: apps, labels: {pod-security.kubernetes.io/enforce: restricted}}}
  - {apiVersion: v1, kind: Namespace, metadata: {name: kube-system}}
  - {apiVersion: v1, kind: ServiceAccount, metadata: {name: web, namespace: apps}}
  - apiVersion: apps/v1
    kind: Deployment
    metadata: {name: platform-admin, namespace: ops}
    spec:
      template:
        spec:
          serviceAccountName: platform-admin
          containers:
            - {name: admin, image: "registry.example/platform-admin:7"}
